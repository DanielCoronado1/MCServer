# Local modules are built from source, never fake Modrinth downloads.
# install_server.py/build_release.py discover mods/* automatically.
[[mods]]
id = "dolfinspace"
source = "mods/space"
side = "both"
required-client = true
minecraft = "26.3"
java = 25
dependencies = ["fabricloader", "fabric-api"]
optional-server = ["openpartiesandclaims", "ledger", "luckperms"]

[[mods]]
id = "dolfinlobby"
source = "mods/lobby"
side = "server"
required-client = false
minecraft = "26.3"
java = 25
dependencies = ["fabricloader", "fabric-api", "multiworld"]
