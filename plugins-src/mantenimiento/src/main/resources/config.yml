# ============================================================
#  DolfinMantenimiento - copias de seguridad y reinicio diario
# ============================================================

copias:
  # Cada cuantos minutos se copia el mundo (0 = desactivado).
  cada-minutos: 60
  # Cuantas copias se guardan; las mas viejas se borran.
  conservar: 24
  # Carpeta de destino (relativa a la carpeta del servidor).
  carpeta: "../backups"

reinicio:
  # Hora del reinicio diario (24 h). Vacio ("") = sin reinicio diario.
  # start.bat vuelve a arrancar el servidor solo.
  hora: "05:00"
  # Minutos antes en los que se avisa a los jugadores.
  avisos: [10, 5, 1]
