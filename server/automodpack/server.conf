# AutoModpack: sincroniza a los jugadores con el modpack del servidor.
# Documentacion: https://moddedmc.wiki/en/project/automodpack/docs
#
# El pack para los jugadores sale SOLO de automodpack/host-modpack/main/
# (scripts/install_server.py pone ahi los mods de jugador de pack/).
# Por eso from-server esta vacio: los mods de mods/ que solo usa el servidor
# (LuckPerms, Ledger, C2ME...) no se envian a los jugadores.
modpack {
  name: "DolfinServer"
  General {
    main {
      description: "Mods de DolfinServer"
      # REQUIRED is always installed. RECOMMENDED is pre-selected, players can opt out. OPTIONAL starts unchecked.
      selection: "REQUIRED"
      # extra paths from the server root
      from-server: []
      # drop these from the pack; they do not add files
      exclude: [**/.*, **/.*/**, "**/*.{tmp,disabled,bak}"]
      # pack files players may change; listing a path here does not add it to the pack
      editable: [options.txt, config/**]
      # DISABLED ships every jar. METADATA drops jars whose own metadata says server-only. PLATFORMS also asks Modrinth and CurseForge.
      auto-exclude-server-side-mods: METADATA
    }
  }
}
# HOLEPUNCH uses the Minecraft port. MAGIC can share it or use bindPort. HTTP uses bindPort.
connection-mode: HOLEPUNCH
# require a login-issued download secret
validate-secrets: true
# extra loaders allowed to join; this server's loader is always accepted
accepted-loaders: [fabric]
# tell clients the pack Minecraft and loader versions
advertise-versions-to-sync: true
