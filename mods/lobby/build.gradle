// Compile against the exact nested 26.3 API; install_server.py provides the pinned bundle.
repositories {
    maven { url = 'https://api.modrinth.com/maven' }
}
configurations {
    multiworldBundle
}
dependencies {
    multiworldBundle 'maven.modrinth:multiworld:OwgBsqTu'
    compileOnly files(configurations.multiworldBundle)
    compileOnly files(provider {
        zipTree(configurations.multiworldBundle.singleFile).matching {
            include 'META-INF/jars/Multiworld-Fabric-26.3.jar'
        }.singleFile
    })
}
dependencies {
    implementation project(':mods:space')
    implementation project(':mods:creepers')
    implementation project(':mods:zombies')
}
// Isolated runtime fixtures are built explicitly and never included in the production mod.
sourceSets {
    fixture {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}
tasks.register('fixtureJar', Jar) {
    dependsOn tasks.named('compileFixtureJava')
    archiveClassifier = 'fixture'
    destinationDirectory = layout.buildDirectory.dir('fixtures')
    from sourceSets.fixture.output
}
