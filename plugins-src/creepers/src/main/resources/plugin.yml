# Ficha del plugin: el servidor la lee para saber que cargar.
name: DolfinCreepers
version: '${version}'
main: com.dolfin.creepers.CreepersPlugin
description: Fuegos artificiales en las explosiones y variantes de creeper
author: Dolfin
api-version: '26.3'

commands:
  creeper:
    description: Invoca una variante de creeper (para pruebas)
    usage: /creeper invocar <hielo|electrico|saltarin|multiplicador|gigante|mini> [cantidad] [jugador]
    permission: dolfin.creeper

permissions:
  dolfin.creeper:
    description: Permite usar /creeper
    default: op
