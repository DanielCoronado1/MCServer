# ============================================================
#  DolfinPack - resource pack servido desde este mismo equipo
# ============================================================

# Puerto web donde se sirve el pack (para jugadores por internet hay
# que abrirlo en el router igual que el 25565).
puerto: 8081

# Direccion que reciben los jugadores para descargar el pack.
#  "auto"  = la IP de este equipo en tu red local (sirve en casa / LAN)
#  Para internet: pon tu IP publica o tu dominio, p. ej. "mi-servidor.ddns.net"
host: auto

# true = quien rechace el pack no puede entrar (todos ven el evento igual).
obligatorio: true

# Mensaje que aparece al pedir la descarga (formato MiniMessage).
mensaje: "<red>DolfinServer usa texturas propias para sus eventos.</red> <gray>Se descargan solas, sin mods."
