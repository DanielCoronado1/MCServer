plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
	// Codigo separado: src/main (servidor y comun) y src/client (solo el juego del jugador: texturas, render)
	splitEnvironmentSourceSets()

	mods {
		"dolfincreepers" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// "gradlew desplegar": compila y copia el mod al servidor Fabric
tasks.register('desplegar', Copy) {
	group = 'dolfin'
	description = 'Compila el mod y lo copia a server-fabric/mods'
	from(tasks.named('jar'))
	into(file('../../server-fabric/mods'))
	// La carpeta mods tiene archivos que el servidor bloquea mientras esta encendido.
	doNotTrackState('server-fabric/mods contiene archivos en uso')
}
