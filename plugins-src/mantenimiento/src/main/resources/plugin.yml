# Ficha del plugin: el servidor la lee para saber que cargar.
name: DolfinMantenimiento
version: '${version}'
main: com.dolfin.mantenimiento.MantenimientoPlugin
description: Copias de seguridad automaticas y reinicio diario
author: Dolfin
api-version: '26.3'

commands:
  respaldo:
    description: Hace una copia de seguridad del mundo ahora mismo
    usage: /respaldo
    permission: dolfin.mantenimiento
  reinicio:
    description: Programa un reinicio con avisos, o lo cancela
    usage: /reinicio <minutos|cancelar>
    permission: dolfin.mantenimiento

permissions:
  dolfin.mantenimiento:
    description: Permite usar /respaldo y /reinicio
    default: op
