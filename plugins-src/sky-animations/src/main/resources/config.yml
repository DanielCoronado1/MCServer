# ============================================================
#  DolfinCielo - configuracion del evento /apocalipsis
#  Tras cambiar algo: reinicia el servidor.
# ============================================================

# Segundos que el dragon se queda asomado antes de que todo se cierre.
segundos-dragon: 20

# Remolino del cielo: radio (bloques) y altura sobre donde se lanza el evento.
radio-cielo: 130
altura-cielo: 60

# Grieta: distancia hacia donde miras, altura, y tamano (bloques).
# Que la parte de arriba (altura + alto/2) quede por debajo del remolino.
distancia-brecha: 45
altura-brecha: 24
ancho-brecha: 26
alto-brecha: 40

# Hora del cielo durante el evento (12800 = atardecer; 13500 = ya es de noche).
hora-evento: 12800

# Dragon: cuantos bloques detras de la grieta empieza y termina.
# Negativo = delante de la grieta (con -18 sale y se queda flotando con las alas abiertas).
dragon-distancia-inicial: 20
dragon-distancia-final: -18
# Giro extra en grados (180 = mirando a los jugadores; el dragon tiene la cabeza "al reves").
dragon-giro: 180

# Texto en pantalla cuando se asoma el dragon (formato MiniMessage).
# Dejalo vacio ("") para no mostrar nada.
titulo: "<dark_red><bold>LA BRECHA SE HA ABIERTO"
subtitulo: "<red>algo viene del otro lado..."
